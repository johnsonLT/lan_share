<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanShare - 局域网文件互传</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="title-bar">
      <div class="brand">
        <div class="logo">⇄</div>
        <span>LanShare</span>
      </div>
      <div class="window-controls">
        <button class="btn-min" title="最小化">−</button>
        <button class="btn-max" title="最大化/还原">□</button>
        <button class="btn-restore" title="恢复默认大小">◱</button>
        <button class="btn-close" title="关闭">×</button>
      </div>
    </div>

    <div class="content">
      <div class="hero-card">
        <h1>局域网文件互传</h1>
        <p class="subtitle">可作为服务器被连接，也可作为客户端连接其他设备</p>

        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="server">服务器模式</button>
          <button class="mode-tab" data-mode="client">客户端模式</button>
        </div>
      </div>

      <!-- Server Mode -->
      <div id="serverPanel" class="mode-panel active">
        <div class="control-card">
          <div class="control-row">
            <div class="input-group ip-input-group">
              <label for="serverBindIp">IP 地址</label>
              <div class="ip-input-wrap">
                <input type="text" id="serverBindIp" list="serverBindIpList" placeholder="自动 / 输入 IP">
                <button id="refreshServerIp" class="btn btn-icon" title="刷新本机 IP">🔄</button>
              </div>
              <datalist id="serverBindIpList"></datalist>
            </div>

            <div class="input-group">
              <label for="port">端口号</label>
              <input type="number" id="port" value="34345" min="1024" max="65535">
            </div>

            <button id="toggleServer" class="btn btn-primary">
              <span id="toggleIcon">▶</span>
              <span id="toggleText">启动</span>
            </button>

            <button id="clearServerIpHistory" class="btn btn-icon" title="清除 IP 历史">🗑</button>

            <div class="info-pill" id="ipPill">
              <span class="dot off" id="statusDot"></span>
              <span id="ipText">服务器未启动</span>
            </div>
          </div>

          <div class="folder-row">
            <div class="folder-info">
              <span class="label">共享文件夹</span>
              <span class="path" id="sharedDirPath">加载中...</span>
            </div>
            <div class="folder-actions">
              <button id="changeSharedDir" class="btn btn-secondary">更改</button>
              <button id="openSharedDir" class="btn btn-secondary">打开</button>
            </div>
          </div>

          <div class="folder-row">
            <div class="folder-info">
              <span class="label">文件接收目录</span>
              <span class="path" id="receiveDirPath">加载中...</span>
            </div>
            <div class="folder-actions">
              <button id="changeReceiveDir" class="btn btn-secondary">更改</button>
              <button id="openReceiveDir" class="btn btn-secondary">打开</button>
            </div>
          </div>
        </div>

        <div class="main-grid">
          <div class="panel">
            <h2>📤 添加文件到共享</h2>
            <div class="drop-zone" id="dropZone">
              <div class="icon">⬆</div>
              <div class="hint">
                拖拽文件到此处<br>
                或 <strong>点击选择文件</strong>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2>📁 共享文件列表</h2>
            <div class="file-list" id="fileList">
              <div class="empty-state">
                <div class="icon">📂</div>
                <span>暂无共享文件</span>
              </div>
            </div>
          </div>
        </div>

        <div class="panel clients-panel">
          <h2>📱 已连接客户端</h2>
          <div class="clients-list" id="clientsList">
            <div class="empty-state small">
              <span>暂无客户端连接</span>
            </div>
          </div>
        </div>

        <div class="panel log-panel">
          <h2>📋 运行日志</h2>
          <div class="log-list" id="serverLogList"></div>
        </div>
      </div>

      <!-- Client Mode -->
      <div id="clientPanel" class="mode-panel">
        <div class="control-card">
          <div class="control-row">
            <div class="input-group">
              <label for="serverIp">服务器 IP</label>
              <input type="text" id="serverIp" list="clientServerIpList" placeholder="例如 192.168.1.5">
              <datalist id="clientServerIpList"></datalist>
            </div>

            <div class="input-group">
              <label for="serverPort">端口</label>
              <input type="number" id="serverPort" value="34345" min="1024" max="65535">
            </div>

            <button id="connectServer" class="btn btn-primary">连接</button>
            <button id="disconnectServer" class="btn btn-danger" disabled>断开</button>
            <button id="clearClientIpHistory" class="btn btn-icon" title="清除 IP 历史">🗑</button>
          </div>

          <div class="folder-row">
            <div class="folder-info">
              <span class="label">本机文件接收目录</span>
              <span class="path" id="clientReceiveDirPath">加载中...</span>
            </div>
            <div class="folder-actions">
              <button id="clientChangeReceiveDir" class="btn btn-secondary">更改</button>
              <button id="clientOpenReceiveDir" class="btn btn-secondary">打开</button>
            </div>
          </div>
        </div>

        <div class="main-grid">
          <div class="panel">
            <h2>⬆ 上传文件到服务器</h2>
            <div class="drop-zone" id="clientUploadZone">
              <div class="icon">⬆</div>
              <div class="hint">
                点击选择文件<br>
                <strong>上传到服务器</strong>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2>📥 服务器文件列表</h2>
            <div class="file-list" id="serverFileList">
              <div class="empty-state">
                <div class="icon">📂</div>
                <span>未连接服务器</span>
              </div>
            </div>
          </div>
        </div>

        <div class="panel received-panel">
          <h2>📥 本机接收到的文件</h2>
          <div class="file-list" id="receiveFileList">
            <div class="empty-state">
              <div class="icon">📂</div>
              <span>暂无接收文件</span>
            </div>
          </div>
        </div>

        <div class="panel log-panel">
          <h2>📋 运行日志</h2>
          <div class="log-list" id="clientLogList"></div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusLeft">就绪</span>
      <span id="statusRight">模式: 服务器</span>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
